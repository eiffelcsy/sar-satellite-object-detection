# dinov3_dora_v2 + the Cascade R-CNN retry: now that the heads are warm-started (stage A), Cascade can pay off.
# Thresholds 0.4/0.5/0.6, three per-stage 256-wide heads (cheaper than one 1024-wide head), GIoU kept.
# Run: python train.py --config configs/dinov3_dora_cascade_v2.yaml
name: dinov3_dora_cascade_v2
backbone:
  name: dinov3
  pretrained: true
  params:
    model_name: facebook/dinov3-vitb16-pretrain-lvd1689m
peft:
  method: dora
  params:
    rank: 32
    alpha: 32
  targets: [attn, mlp]
model:
  detail_stem: true
  fusion_layers: [5, 8, 11]
  input_adapter: true
  wst_stem: true
  head: cascade
  head_params:
    num_stages: 3
    share_head: false
    hidden_dim: 256
    fg_iou_thresholds: [0.4, 0.5, 0.6]
    bg_iou_threshold: 0.4
    stage_loss_weights: [0.5, 0.25, 0.25]
  giou_weight: 1.0
  focal_loss: true
  focal_gamma: 2.0
  focal_alpha: 0.25
  roi_sampling_ratio: 4
preprocess:
  pseudo_rgb: true
  mode: despeckle
  edge: sobel
  cache: preprocess_cache
data:
  mosaic: 0.1
  copy_paste: 0.5
  scale_jitter: [0.8, 1.25]
  rotation90: true
loss:
  classification: 1.0
  loss_box_reg: 2.0
  loss_rpn_box_reg: 1.5
train:
  epochs: 48
  stage_a_epochs: 10
  stage_a_lr: 2.0e-4
