# DINOv3 ViT-B/16 + pseudo-RGB input + LoRA (attn+mlp) + Deformable-DETR detection head.
#
# The detector replaces torchvision Faster R-CNN with a query-based Deformable-DETR head (~11 M parameters,
# hidden 256): no anchors/NMS, and its deformable attention samples every pyramid level, including the
# stride-4 P2 level that matters for tiny SAR objects. `level_names` picks which neck levels feed the head
# ('0' = stride 4, '1' = stride 8, '2' = stride 16, '3' = stride 32, 'pool' = stride 64).
#
# See configs/dinov3_lora.yaml for the gated-weights / pseudo-RGB notes.
# Run: python train.py --config configs/dinov3_deformable_detr_lora.yaml
name: dinov3_deformable_detr_lora
backbone:
  name: dinov3
  pretrained: true
  params:
    model_name: facebook/dinov3-vitb16-pretrain-lvd1689m
peft:
  method: lora
  params:
    rank: 32
    alpha: 32
  targets: [attn, mlp]
detector:
  name: deformable_detr
  params:
    num_queries: 300
    enc_layers: 6
    dec_layers: 6
    d_model: 256
    n_heads: 8
    n_points: 4
    level_names: ['0', '1', '2', '3']  # P2-P5 (strides 4, 8, 16, 32)
    grad_checkpointing: true           # P2 makes the encoder long; recompute layers to save GPU memory
preprocess:
  pseudo_rgb: true
  edge: sobel
  cache: preprocess_cache
loss:                # per-term weights on the summed loss (default 1.0); classification is already strong
  classification: 1.0
  loss_bbox: 1.75     # Deformable-DETR L1 box loss
  loss_giou: 1.75     # Deformable-DETR GIoU box loss
  # loss_aux: 1.0    # auxiliary decoder-layer classification loss
