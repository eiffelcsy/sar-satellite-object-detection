# (f3 showed the two compete: heads at 2e-4 cost 1.1 F1). ~8.7 h. Compare with g1_split_lr_200ep: mAP, macro-F1, and
# their delta-m on Codabench.
base: g1_split_lr_200ep.yaml
name: giou_i1_cls_loss01_200ep
loss:
  classification: 0.1
