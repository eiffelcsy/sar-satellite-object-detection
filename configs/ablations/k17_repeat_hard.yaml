# K17 (repeat the weakest classes, nothing skipped, no pasted bridges): k16's fix, but every j1 image is still seen
# once per epoch and bridge / playground images get one extra copy each (RepeatFactorSampler, LVIS repeat-factor
# sampling). The epoch grows from ~8.5k to ~10.6k images (+26% steps and time, ~5 h) with the same number of epochs,
# so other classes see exactly j1's data. Bridge images also skip copy-paste: a bridge needs water under it and land
# at both ends, and a crop with a 1 px margin pasted at a random spot lands on land or in open water (diagonal
# bridges also bring a rectangle of water with a hard seam). Two changes vs k16; compare with j1_roi_fused (bridge /
# playground AP, other classes hold) and with k16 (weighted draws at j1's epoch length).
base: k16_oversample_hard.yaml
name: giou_k17_repeat_hard
data:
  class_sampling_mode: repeat
  copy_paste_exclude: [bridge]
