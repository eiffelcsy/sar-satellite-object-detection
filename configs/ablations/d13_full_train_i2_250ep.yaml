# D13 (final candidate): i2's recipe (g1 + the image classifier on detached tokens, so the adapters train for
# detection only) at 250 epochs on all of train (val_fraction 0). i2 beat g1 on the held-out split. ~12 h. Note:
# g1's recipe at 250 epochs (d11, 38.34) did not beat 200 (d10 38.50), but i2's adapters get detection gradients only,
# so its schedule may peak later. No held-out split: compare its Codabench delta-m with d12 (g1 recipe, 200 epochs).
# The run writes model.pt only: make the zips with sbatchScriptEval.sh section 9.
base: i2_cls_detach_200ep.yaml
name: giou_d13_full_train_i2_250ep
train:
  epochs: 250
data:
  val_fraction: 0
