# Deformable-Conv RoI head + all new detection losses + finer RoIAlign.
# Head-comparison trio (identical apart from `model.head`): configs/dinov3_dora_giou_focal.yaml (standard),
# this file (deform) and configs/dinov3_dora_cascade_giou_focal.yaml (cascade). Also multi-layer fusion.
# Run: python train.py --config configs/dinov3_dora_deform_giou_focal.yaml
name: dinov3_dora_deform_giou_focal
backbone:
  name: dinov3
  pretrained: true
  params:
    model_name: facebook/dinov3-vitb16-pretrain-lvd1689m
peft:
  method: dora
  params:
    rank: 32
    alpha: 32
  targets: [attn, mlp]
model:
  detail_stem: true
  fusion_layers: [5, 8, 11]  # 0-indexed ViT blocks combined with learnable softmax weights before the neck
  head: deform
  head_params:
    num_convs: 1
    kernel_size: 3
    hidden_dim: 512
  giou_weight: 1.0        # extra GIoU term on the RoI box loss
  focal_loss: true        # focal for RPN objectness, RoI classifier and image classifier
  focal_gamma: 2.0
  focal_alpha: 0.25
  roi_sampling_ratio: 4   # finer RoIAlign for small objects
preprocess:
  pseudo_rgb: true
  edge: sobel
  cache: preprocess_cache
data:
  mosaic: 0.3
  copy_paste: 0.5
loss:
  classification: 1.0
  loss_box_reg: 2.0
  loss_rpn_box_reg: 1.5
train:
  epochs: 48
