# Multi-layer FPN fusion ablation: dinov3_dora + a learnable fusion of ViT blocks 5/8/11 before the neck.
# Everything else matches configs/dinov3_dora.yaml, so the delta is the fusion only.
# Run: python train.py --config configs/dinov3_dora_fusion.yaml
name: dinov3_dora_fusion
backbone:
  name: dinov3
  pretrained: true
  params:
    model_name: facebook/dinov3-vitb16-pretrain-lvd1689m
peft:
  method: dora
  params:
    rank: 32
    alpha: 32
  targets: [attn, mlp]
model:
  detail_stem: true
  fusion_layers: [5, 8, 11]  # 0-indexed ViT blocks (last is 11); fused with learnable softmax weights
preprocess:
  pseudo_rgb: true
  edge: sobel
  cache: preprocess_cache
data:
  mosaic: 0.3
  copy_paste: 0.5
loss:
  classification: 1.0
  loss_box_reg: 2.0
  loss_rpn_box_reg: 1.5
train:
  epochs: 48
