# ViT-B/16 (ImageNet-21k), every backbone weight trains. Over the 40 M trainable budget: reference only.
# Run: python train.py --config configs/vit_full.yaml
name: vit_full
backbone:
  name: vit
  pretrained: true
  params:
    timm_name: vit_base_patch16_224.augreg_in21k
peft:
  method: full
train:
  backbone_lr: 0.00002  # fine-tune the pretrained backbone gently
