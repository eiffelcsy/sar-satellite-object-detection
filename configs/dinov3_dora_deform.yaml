# Deformable-Conv RoI head + multi-layer fusion: dinov3_dora with `model.head: deform` and `model.fusion_layers`.
# Everything else (backbone, DoRA, detail stem, augmentation, loss, 48 epochs) matches configs/dinov3_dora.yaml,
# so the delta is the detection head plus fusion. Compare with configs/dinov3_dora_cascade.yaml.
# Run: python train.py --config configs/dinov3_dora_deform.yaml
name: dinov3_dora_deform
backbone:
  name: dinov3
  pretrained: true
  params:
    model_name: facebook/dinov3-vitb16-pretrain-lvd1689m
peft:
  method: dora
  params:
    rank: 32
    alpha: 32
  targets: [attn, mlp]
model:
  detail_stem: true
  fusion_layers: [5, 8, 11]  # 0-indexed ViT blocks combined with learnable softmax weights before the neck
  head: deform
  head_params:
    num_convs: 1
    kernel_size: 3
    hidden_dim: 512
preprocess:
  pseudo_rgb: true
  edge: sobel
  cache: preprocess_cache
data:
  mosaic: 0.3
  copy_paste: 0.5
loss:
  classification: 1.0
  loss_box_reg: 2.0
  loss_rpn_box_reg: 1.5
train:
  epochs: 48
