# Loss ablation: dinov3_dora + focal loss for the RPN objectness, RoI classifier and image classifier.
# Nothing else changes. (Focal shrinks the loss scale, so the `loss:` weights may want re-tuning.)
# Run: python train.py --config configs/dinov3_dora_focal.yaml
name: dinov3_dora_focal
backbone:
  name: dinov3
  pretrained: true
  params:
    model_name: facebook/dinov3-vitb16-pretrain-lvd1689m
peft:
  method: dora
  params:
    rank: 32
    alpha: 32
  targets: [attn, mlp]
model:
  detail_stem: true
  focal_loss: true
  focal_gamma: 2.0
  focal_alpha: 0.25
preprocess:
  pseudo_rgb: true
  edge: sobel
  cache: preprocess_cache
data:
  mosaic: 0.3
  copy_paste: 0.5
loss:
  classification: 1.0
  loss_box_reg: 2.0
  loss_rpn_box_reg: 1.5
train:
  epochs: 48
