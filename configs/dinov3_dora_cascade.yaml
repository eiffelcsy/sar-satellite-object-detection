# Cascade R-CNN + multi-layer fusion: dinov3_dora with `model.head: cascade` and `model.fusion_layers`.
# Everything else matches configs/dinov3_dora.yaml, so the delta is the detection head plus fusion.
# Cascade is tuned for tiny objects: 3 per-stage heads at hidden 256 (cheaper than one 1024 head, so it fits
# the budget), lower IoU thresholds 0.4/0.5/0.6 (16 px objects have noisy IoU), and stage loss weights that
# keep the summed RoI loss comparable to the single-stage runs. Between stages inference keeps all refined
# proposals (no NMS/threshold) so later stages can still recover small objects.
# Run: python train.py --config configs/dinov3_dora_cascade.yaml
name: dinov3_dora_cascade
backbone:
  name: dinov3
  pretrained: true
  params:
    model_name: facebook/dinov3-vitb16-pretrain-lvd1689m
peft:
  method: dora
  params:
    rank: 32
    alpha: 32
  targets: [attn, mlp]
model:
  detail_stem: true
  fusion_layers: [5, 8, 11]  # 0-indexed ViT blocks combined with learnable softmax weights before the neck
  head: cascade
  head_params:
    num_stages: 3
    share_head: false              # per-stage heads; hidden 256 keeps this cheaper than one 1024 head
    hidden_dim: 256
    fg_iou_thresholds: [0.4, 0.5, 0.6]  # lower than the 0.5/0.6/0.7 default: 16 px objects have noisy IoU
    bg_iou_threshold: 0.4              # must be <= the smallest fg threshold (Matcher requires low <= high)
    stage_loss_weights: [1.0, 0.5, 0.5]  # rebalance the 3 summed stage losses vs the RPN/classification
preprocess:
  pseudo_rgb: true
  edge: sobel
  cache: preprocess_cache
data:
  mosaic: 0.3
  copy_paste: 0.5
loss:
  classification: 1.0
  loss_box_reg: 2.0
  loss_rpn_box_reg: 1.5
train:
  epochs: 48
